<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recap — Kairos Automata</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; padding: 0 0 60px; }
    header { background: #13161f; border-bottom: 1px solid #1e2130; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    .content { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
    .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .btn { background: transparent; border: 1px solid #2a2d3e; color: #ccc; border-radius: 6px; padding: 6px 12px; font-size: 0.8rem; font-family: inherit; cursor: pointer; }
    .btn:hover { border-color: #4a5568; }
    .btn.on { border-color: #3a7a4e; color: #7FE098; }
    .btn-copy { border-color: #3a7a4e; color: #7FE098; }
    .meta { font-size: 0.75rem; color: #666; }
    .panel { background: #13161f; border: 1px solid #1e2130; border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; }
    .band-q { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: #f0a35e; margin-bottom: 2px; }
    .band-sub { font-size: 0.72rem; color: #666; margin-bottom: 12px; line-height: 1.5; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 10px; }
    /* overflow:hidden is the backstop — nothing inside a tile may paint over its neighbours. */
    .tile { background: #0f1219; border: 1px solid #1e2130; border-radius: 8px; padding: 10px 12px;
            overflow: hidden; min-width: 0; }
    .tile .k { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.07em; color: #555;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .v { font-size: 1.3rem; font-weight: 700; margin: 3px 0;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .s { font-size: 0.66rem; color: #666; overflow-wrap: anywhere; }
    .pos { color: #7FE098; } .neg { color: #e08a8a; } .thin { color: #8a90a0; }
    /* Dials — ported from the dashboard perf cards so both read the same. */
    .tile-split { display: flex; align-items: center; gap: 10px; }
    .tile-split .tile-left { min-width: 0; flex: 1; }
    .gauge-wrap { width: 72px; flex: 0 0 auto; }
    .gauge-wrap canvas { display: block; width: 100% !important; max-height: 44px; }
    .gauge-counts { display: flex; justify-content: space-between; font-size: 0.6rem;
                    margin-top: 1px; padding: 0 2px; width: 100%; }
    .gauge-counts .wins { color: #7FE098; } .gauge-counts .mid { color: #555; }
    .gauge-counts .losses { color: #ef5350; }
    .ring-wrap { width: 48px; height: 48px; flex: 0 0 auto; }
    .ring-wrap canvas { width: 100% !important; height: 100% !important; max-height: 48px; }
    /* Tiles must not be stretched by their contents. */
    .tile-split { align-items: center; }
    .tiles > .tile { align-self: start; }
    .winloss-bar-wrap { width: 72px; flex: 0 0 auto; }
    .winloss-bar { height: 6px; border-radius: 3px; display: flex; overflow: hidden; margin-bottom: 5px; }
    .winloss-bar .win-seg { background: #517356; } .winloss-bar .loss-seg { background: #ef5350; }
    .winloss-labels { display: flex; flex-direction: column; gap: 2px; font-size: 0.66rem;
                      white-space: nowrap; }
    .winloss-labels .wl-win { color: #7FE098; } .winloss-labels .wl-loss { color: #ef5350; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th { text-align: left; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: #666; font-weight: 600; padding: 5px 8px; }
    td { padding: 5px 8px; border-top: 1px solid #171a24; }
    .empty { padding: 16px; text-align: center; color: #555; font-size: 0.82rem; }
    .pill { display: inline-block; font-size: 0.66rem; padding: 2px 8px; border-radius: 20px; margin: 2px 4px 2px 0; }
    .pill.on  { background: rgba(127,224,152,0.12); color: #7FE098; border: 1px solid #2a4a35; }
    .pill.off { background: rgba(120,120,140,0.08); color: #666; border: 1px solid #262a38; }
    /* Gate reference modal — every gate name on this page opens its own rules. */
    .pill.tapable { cursor: pointer; }
    .pill.tapable:hover { filter: brightness(1.35); }
    .gate-link { background: none; border: none; padding: 0; font: inherit; color: #f0a35e;
                 cursor: pointer; border-bottom: 1px dotted #6a5232; }
    .gate-link:hover { color: #ffc48a; border-bottom-color: #f0a35e; }
    .gm-body { padding: 14px 18px 18px; }
    .gm-state { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
                font-size: 0.76rem; margin-bottom: 12px; }
    .gm-what { font-size: 0.92rem; line-height: 1.6; color: #dfe4ee; margin-bottom: 14px; }
    .gm-h { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.08em;
            color: #666; margin: 14px 0 6px; }
    .gm-body ul { margin: 0; padding-left: 18px; }
    .gm-body li { font-size: 0.83rem; line-height: 1.6; color: #c3c9d6; margin-bottom: 5px; }
    .gm-why { font-size: 0.83rem; line-height: 1.65; color: #a8afc0; border-left: 2px solid #3a3f52;
              padding-left: 11px; }
    .gm-note { font-size: 0.78rem; color: #e0b080; background: rgba(240,163,94,0.07);
               border: 1px solid #4a3a22; border-radius: 6px; padding: 8px 11px; margin-top: 14px; }
    .gm-src { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em;
              color: #7a6a4a; border: 1px solid #3a3222; border-radius: 20px; padding: 1px 7px; }
    .script-line { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid #171a24; font-size: 0.85rem; line-height: 1.55; }
    .script-seg { flex: 0 0 150px; color: #f0a35e; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 3px; }
    /* Script notes stay COLLAPSED by default so they cannot land on screen mid-record. */
    .script-toggle { background: rgba(240,163,94,0.08); border: 1px solid #4a3a22; color: #f0a35e;
                     border-radius: 6px; padding: 6px 14px; font-size: 0.8rem; font-family: inherit;
                     cursor: pointer; font-weight: 600; }
    .script-toggle:hover { border-color: #6a5232; }
    .script-body { display: none; margin-top: 12px; }
    .script-body.open { display: block; }
    .prose { margin-top: 14px; border-top: 1px solid #1e2130; padding-top: 12px; }
    .prose p { font-size: 0.95rem; line-height: 1.75; color: #cdd3e0; margin-bottom: 14px;
               max-width: 76ch; }
    .prose p:last-child { margin-bottom: 0; }
    .day-chart { height: 300px; }
    .eq-wrap { height: 240px; margin-bottom: 14px; }
    .chart-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
    @media (max-width: 900px) { .chart-cols { grid-template-columns: 1fr; } }
    .chart-col { display: flex; flex-direction: column; gap: 14px; }
    .col-head { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; }
    .mini.clickable { cursor: zoom-in; }
    .mini.clickable:hover { border-color: #3a7a4e; }
    .mini-zoom { background: transparent; border: 1px solid #2a2d3e; color: #888; border-radius: 4px;
                 font-size: 0.7rem; padding: 1px 6px; cursor: pointer; margin-left: 6px; }
    .mini-zoom:hover { border-color: #4a5568; color: #ccc; }
    /* Enlarge modal */
    .modal-back { position: fixed; inset: 0; background: rgba(6,8,12,0.82); z-index: 1000;
                  display: none; align-items: center; justify-content: center; padding: 24px; }
    .modal-back.show { display: flex; }
    .modal-card { background: #13161f; border: 1px solid #2a2d3e; border-radius: 12px;
                  width: min(1200px, 96vw); max-height: 92vh; overflow: auto; }
    .modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                  border-bottom: 1px solid #1e2130; position: sticky; top: 0; background: #13161f; }
    .modal-x { margin-left: auto; background: transparent; border: 1px solid #2a2d3e; color: #ccc;
               border-radius: 6px; padding: 4px 12px; font-size: 0.85rem; cursor: pointer; }
    .modal-x:hover { border-color: #4a5568; }
    .modal-chart { height: min(62vh, 560px); }
    .mini { border: 1px solid #1e2130; border-radius: 8px; overflow: hidden; background: #0f1219; }
    .mini-head { display: flex; align-items: center; gap: 8px; padding: 7px 11px; border-bottom: 1px solid #1e2130; }
    .mini-name { font-size: 0.76rem; font-weight: 700; color: #ddd; }
    .mini-meta { font-size: 0.68rem; color: #666; }
    .mini-pl { margin-left: auto; font-weight: 700; font-size: 0.8rem; }
    .mini-chart { height: 200px; }
    .day-rows { width: 100%; border-collapse: collapse; font-size: 0.74rem; }
    .day-rows td { padding: 5px 12px; border-top: 1px solid #171a24; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1d2e; border: 1px solid #3a7a4e; color: #7FE098; padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="/" style="display:inline-flex"><img src="/static/kariosLogo_128.png" alt="Home" style="height:36px;width:36px;image-rendering:pixelated;cursor:pointer"></a>
      <h1>Kairos Automata — Recap</h1>
    </div>
    <div style="position:relative;display:inline-block">
      <button id="navMenuBtn" onclick="toggleNavMenu()" style="background:transparent;border:1px solid #2a2d3e;color:#aaa;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:1.1rem;line-height:1">&#9776;</button>
      <div id="navMenu" style="display:none;position:absolute;top:calc(100% + 6px);right:0;background:#1a1d2e;border:1px solid #2a2d3e;border-radius:6px;min-width:190px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.4)">
        <a href="/" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#127968; Dashboard</a>
        <a href="/routing" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128257; Signal Router</a>
        <a href="/analysis" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128300; Analysis</a>
        <a href="/review" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128202; Chart Review</a>
        <a href="/strategies" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128200; Strategies</a>
        <a href="/optimize" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128269; Optimizer</a>
        <a href="/progress" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#9989; Progress</a>
        <a href="/research" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#129514; Research</a>
        <a href="/journal" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128221; Journal</a>
        <a href="/simulate" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#127916; Replay</a>
        <a href="/strategy-explorer" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128202; Strategy Explorer</a>
        <a href="/recap" style="display:block;padding:10px 16px;color:#7FE098;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#127916; Recap</a>
        <a href="/crew" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#10022; Crew</a>
        <a href="/diagnostics" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128736; Diagnostics</a>
        <a href="/about" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem">&#8505; About</a>
      </div>
    </div>
  </header>

  <div class="content">
    <div class="bar">
      <button class="btn" id="p_last_week"  onclick="setPeriod('last_week')">Last week</button>
      <button class="btn" id="p_this_week"  onclick="setPeriod('this_week')">This week</button>
      <button class="btn" id="p_last_month" onclick="setPeriod('last_month')">Last month</button>
      <button class="btn" id="p_this_month" onclick="setPeriod('this_month')">This month</button>
      <span class="meta" id="meta">loading…</span>
      <button class="btn btn-copy" style="margin-left:auto" onclick="copyScript()">📋 Copy script</button>
    </div>

    <div id="body"></div>
  </div>

  <div class="modal-back" id="chartModal" onclick="if (event.target === this) closeChartModal()">
    <div class="modal-card">
      <div class="modal-head">
        <span class="mini-name" id="mTitle"></span>
        <span class="mini-meta" id="mMeta"></span>
        <span class="mini-pl" id="mPl"></span>
        <button class="modal-x" onclick="closeChartModal()">Close ✕</button>
      </div>
      <div class="modal-chart" id="mChart"></div>
      <table class="day-rows" id="mRows"><tbody></tbody></table>
    </div>
  </div>

  <div class="modal-back" id="gateModal" onclick="if (event.target === this) closeGateModal()">
    <div class="modal-card" style="width:min(680px,96vw)">
      <div class="modal-head">
        <span class="mini-name" id="gmTitle"></span>
        <span class="mini-meta" id="gmFor"></span>
        <button class="modal-x" onclick="closeGateModal()">Close ✕</button>
      </div>
      <div class="gm-body" id="gmBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  let DATA = null, GATES = null, GATE_DOCS = null, period = 'last_week';
  let eqChart = null;          // Chart.js equity curve
  const miniCharts = [];       // lightweight-charts instances, destroyed on reload
  const SESSIONS   = [];       // [{pick, ss}] per card — the modal reuses this, no refetch
  let modalChart = null;
  const dials = {};            // canvasId -> Chart, destroyed before each redraw
  const PERIODS = ['last_week', 'this_week', 'last_month', 'this_month'];

  function toggleNavMenu() {
    const m = document.getElementById('navMenu');
    m.style.display = m.style.display === 'none' ? 'block' : 'none';
  }
  document.addEventListener('click', e => {
    const btn = document.getElementById('navMenuBtn'), menu = document.getElementById('navMenu');
    if (menu && !menu.contains(e.target) && e.target !== btn) menu.style.display = 'none';
  });

  const money = v => (v < 0 ? '-$' : '$') + Math.abs(Number(v || 0)).toFixed(2);
  const esc   = s => String(s == null ? '' : s).replace(/</g, '&lt;');
  const cls   = v => (v >= 0 ? 'pos' : 'neg');

  // Fills come back UTC; the tape is read in ET. Display-only formatting.
  const _etTime = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false });
  const _etFull = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: false });
  const _etHM = (iso) => {
    if (!iso) return '';
    const t = String(iso);
    const d = new Date(/(Z|[+-]\d{2}:?\d{2})$/.test(t) ? t : t + 'Z');
    return isNaN(d.getTime()) ? '' : _etTime.format(d);
  };

  function _toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function setPeriod(p) { period = p; load(); }

  async function load() {
    for (const p of PERIODS) {
      const b = document.getElementById('p_' + p);
      if (b) b.classList.toggle('on', period === p);
    }
    document.getElementById('meta').textContent = 'loading…';
    document.getElementById('body').innerHTML = '';
    try {
      const d = await fetch(`/api/recap?period=${period}`).then(r => r.json());
      if (d.error) {
        document.getElementById('meta').textContent = d.error;
        document.getElementById('body').innerHTML = `<div class="panel"><div class="empty">${esc(d.error)}</div></div>`;
        return;
      }
      DATA = d;
      document.getElementById('meta').textContent = `${d.label} · ${d.week_label}`;
      render();
      drawDials();          // win-rate gauge, PF ring, win/loss bar
      drawEquity();         // cumulative P&L, same period as everything else
      loadGateDocs();       // gate rule reference — powers every gate modal
      loadGates();          // the Refusal panel — separate call, it is the slow one
      loadSixCharts();      // top 3 + bottom 3, one session each
    } catch (e) {
      document.getElementById('meta').textContent = 'failed: ' + e;
    }
  }

  function render() {
    const d = DATA, b = d.book;
    const gatePills = (d.gates || []).map(g =>
      `<span class="pill tapable ${g.on ? 'on' : 'off'}" title="${esc(g.detail)} — click for the rule"
             onclick="openGateModal('${esc(g.key || g.gate)}')">${g.on ? '●' : '○'} ${esc(g.gate)}</span>`).join('');

    const stratRow = (s, i) => `<tr>
      <td style="color:#666">${i + 1}</td>
      <td class="mono">${esc(s.name.replace(/_V02_5MIN$/, ''))}</td>
      <td>${s.trades}</td>
      <td>${s.win_rate.toFixed(0)}%</td>
      <td class="${cls(s.expectancy)}">${money(s.expectancy)}</td>
      <td class="${cls(s.pnl)}" style="text-align:right;font-weight:700">${money(s.pnl)}</td></tr>`;

    document.getElementById('body').innerHTML = `
      <div class="panel">
        <div class="band-q">1 · The book</div>
        <div class="band-sub">Crew Paper only — one book, one narrative. <b>Paper money.</b>
          Cumulative P&amp;L from closed trades over the selected period.</div>
        <div class="eq-wrap"><canvas id="eq"></canvas></div>
        <div class="tiles">
          <div class="tile"><div class="k">Week P&amp;L</div>
            <div class="v ${cls(b.pnl)}">${money(b.pnl)}</div>
            <div class="s">${b.trades} trade${b.trades === 1 ? '' : 's'}</div></div>
          <div class="tile tile-split">
            <div class="tile-left"><div class="k">Win rate</div>
              <div class="v">${b.trades === 0 ? '—' : b.win_rate.toFixed(1) + '%'}</div>
              <div class="s">${b.n_strategies_traded} strateg${b.n_strategies_traded === 1 ? 'y' : 'ies'}</div></div>
            <div class="gauge-wrap">
              <canvas id="winGauge" height="52"></canvas>
              <div class="gauge-counts"><span class="wins">${b.win_count}</span>
                <span class="mid">W/L</span><span class="losses">${b.loss_count}</span></div>
            </div>
          </div>
          <div class="tile"><div class="k">Best day</div>
            <div class="v ${b.best_day ? cls(b.best_day[1]) : ''}">${b.best_day ? money(b.best_day[1]) : '—'}</div>
            <div class="s">${b.best_day ? esc(b.best_day[0]) : 'no trades'}</div></div>
          <div class="tile"><div class="k">Worst day</div>
            <div class="v ${b.worst_day ? cls(b.worst_day[1]) : ''}">${b.worst_day ? money(b.worst_day[1]) : '—'}</div>
            <div class="s">${b.worst_day ? esc(b.worst_day[0]) : 'no trades'}</div></div>
          <div class="tile tile-split" title="Gross wins divided by gross losses. Unstable at low loss counts — one more loser can halve it.">
            <div class="tile-left"><div class="k">Profit factor</div>
            <div class="v ${b.profit_factor == null ? 'pos' : (b.profit_factor >= 1 ? 'pos' : 'neg')}">${
              b.trades === 0 ? '—' : (b.profit_factor == null ? '∞' : b.profit_factor.toFixed(2))}</div>
            <div class="s">${money(b.gross_win)} won / ${money(b.gross_loss)} lost${
              b.loss_count > 0 && b.loss_count <= 2
                ? ' <span style="color:#f0a35e">· only ' + b.loss_count + ' loser' + (b.loss_count === 1 ? '' : 's') + '</span>'
                : ''}</div></div>
            <div class="ring-wrap"><canvas id="pfRing"></canvas></div>
          </div>
          <div class="tile" title="Largest peak-to-trough fall of the realised equity curve within this period.">
            <div class="k">Max drawdown</div>
            <div class="v ${b.max_drawdown < 0 ? 'neg' : ''}">${b.trades === 0 ? '—' : money(b.max_drawdown)}</div>
            <div class="s">peak to trough, realised</div></div>
          <div class="tile tile-split" title="Mean P&L of winning vs losing trades. A scratch (0.00) trade counts as a loss.">
            <div class="tile-left"><div class="k">Avg win / loss</div>
              <div class="v">${b.avg_win == null ? '—' : money(b.avg_win)}</div>
              <div class="s">${b.win_count}W · ${b.loss_count}L${
                b.avg_win != null && b.avg_loss != null && b.avg_loss !== 0

  function renderEntrySplit(es) {
    if (!es) return '<div class="empty">no data</div>';
    const rows = [['tv', 'TV alerts'], ['kairos', 'Kairos engine'], ['unknown', 'Not wired']]
      .filter(([k]) => (es[k] || {}).trades);
    if (!rows.length) return '<div class="empty">No trades this window.</div>';
    const m  = v => (v == null) ? '—' : (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2);
    const cl = v => (v || 0) >= 0 ? 'pos' : 'neg';
    const th = 'style="text-align:right;padding:5px 10px;color:#666;font-weight:500;font-size:0.64rem"';
    const td = 'style="text-align:right;padding:5px 10px"';
    return `<table style="width:100%;border-collapse:collapse;font-size:0.78rem">
      <tr><th style="text-align:left;padding:5px 10px;color:#666;font-weight:500;font-size:0.64rem">ENTRY VIA</th>
        <th ${th}>STRATEGIES</th><th ${th}>TRADES</th><th ${th}>WIN %</th>
        <th ${th}>EXPECTANCY</th><th ${th}>PF</th><th ${th}>NET P&amp;L</th></tr>
      ${rows.map(([k, lbl]) => { const v = es[k]; return `
        <tr style="border-top:1px solid #22242f">
          <td style="padding:5px 10px;color:${k === 'kairos' ? '#F2E7AC' : k === 'tv' ? '#c4b5fd' : '#666'}">${lbl}</td>
          <td ${td} style="text-align:right;color:#888">${v.strategies}</td>
          <td ${td}>${v.trades}</td>
          <td ${td}>${v.win_rate.toFixed(1)}%</td>
          <td ${td} class="${cl(v.expectancy)}">${m(v.expectancy)}</td>
          <td ${td}>${v.profit_factor == null ? '∞' : v.profit_factor.toFixed(2)}</td>
          <td ${td} class="${cl(v.pnl)}" style="font-weight:600">${m(v.pnl)}</td>
        </tr>`; }).join('')}
    </table>
    <div style="font-size:0.64rem;color:#555;margin-top:6px">Expectancy is per trade &mdash; the
      comparison that survives the two mechanisms trading different numbers of times.</div>`;
  }

  function renderScorecard(sc) {
    if (!sc || !sc.picks) return '<div class="empty">No crew report with parseable picks yet.</div>';
    // Bucketed by the [TV]/[Kairos] tag the crew wrote in THIS report — the entry
    // mechanism each pick was chosen for. Read from the report rather than from
    // current rule wiring, so a pick rewired since then is still graded under the
    // decision that was actually made. Each bucket carries its own subtotal, which
    // is the comparison the split exists for.
    const _row = p => `<tr>
      <td class="mono">${esc(p.strategy.replace(/_V02_5MIN$/, ''))}</td>
      <td style="color:#888">${esc(p.side)}</td>
      <td>${p.trades}</td>
      <td class="${p.pnl == null ? 'thin' : cls(p.pnl)}" style="text-align:right">
        ${p.pnl == null ? 'no trades' : money(p.pnl)}</td></tr>`;
    const _bucket = (key, label, colour) => {
      const ps = sc.picks.filter(p => (p.entry || 'tv') === key);
      if (!ps.length) return '';
      const traded = ps.filter(p => p.pnl != null);
      const net    = traded.reduce((t, p) => t + p.pnl, 0);
      const green  = traded.filter(p => p.pnl > 0).length;
      return `<tr><td colspan="4" style="padding:10px 8px 3px">
          <span style="color:${colour};font-weight:600;font-size:0.78rem">${label}</span>
          <span style="color:#666;font-size:0.72rem;margin-left:8px">
            ${ps.length} pick${ps.length === 1 ? '' : 's'} ·
            ${traded.length} traded · ${green} green ·
            net <span class="${cls(net)}">${money(net)}</span></span>
        </td></tr>` + ps.map(_row).join('');
    };
    const rows = _bucket('tv', 'TV entries', '#c4b5fd')
               + _bucket('kairos', 'Kairos entries', '#F2E7AC');
    const m = sc.summary || {};
    const cards = !sc.summary ? '' : `
      <div class="tiles" style="margin-bottom:12px">
        <div class="tile"><div class="k">Net since wire</div>
          <div class="v ${cls(sc.total_pnl)}">${money(sc.total_pnl)}</div>
          <div class="s">${m.n_traded} of ${m.n_picks} picks traded</div></div>
        <div class="tile"><div class="k">Picks in profit</div>
          <div class="v pos">${m.n_positive}</div>
          <div class="s">${m.trades_positive} trade${m.trades_positive === 1 ? '' : 's'} · ${money(m.pnl_positive)}</div></div>
        <div class="tile"><div class="k">Picks in the red</div>
          <div class="v neg">${m.n_negative}</div>
          <div class="s">${m.trades_negative} trade${m.trades_negative === 1 ? '' : 's'} · ${money(m.pnl_negative)}</div></div>
        <div class="tile" title="A pick that never fires is a selection failure, not a neutral result — the slot could have gone to a name that trades.">
          <div class="k">Never traded</div>
          <div class="v ${m.n_untraded ? 'thin' : ''}">${m.n_untraded}</div>
          <div class="s">${m.activation == null ? '—' : m.activation.toFixed(0) + '% of the roster fired'}</div></div>
        <div class="tile" title="Of the picks that actually fired, the share that made money. This is the out-of-sample read on the selection method.">
          <div class="k">Hit rate</div>
          <div class="v">${m.hit_rate == null ? '—' : m.hit_rate.toFixed(0) + '%'}</div>
          <div class="s">${m.n_positive}/${m.n_traded} traded picks green</div></div>
        ${m.top_share == null ? '' : `
        <div class="tile" title="Share of the net that came from the single best pick. High concentration means the book's result is one name, not the method.">
          <div class="k">Top pick share</div>
          <div class="v ${m.top_share >= 60 ? 'thin' : ''}">${m.top_share.toFixed(0)}%</div>
          <div class="s">${esc(String(m.top_pick || '').replace(/_V02_5MIN$/, '').split('_CAM_')[0])} ${money(m.top_pick_pnl)}</div></div>`}
      </div>`;
    return cards + `<div style="font-size:0.8rem;margin-bottom:8px">
        Report <b>${esc(sc.report_week)}</b> · ${sc.n_traded}/${sc.n_picks} traded ·
        <span class="${cls(sc.n_positive)}">${sc.n_positive} positive</span> ·
        net <span class="${cls(sc.total_pnl)}">${money(sc.total_pnl)}</span> since ${esc(sc.since || '')}
      </div>
      <table><thead><tr><th>Pick</th><th>Side</th><th>Trades</th><th style="text-align:right">P&amp;L since wire</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="band-sub" style="margin-top:8px">${esc(sc.caveat || '')}</div>`;
  }

  // ── Dials ─────────────────────────────────────────────────────────────────
  // Ported from the dashboard's perf cards so the same numbers look the same in
  // both places: a semicircle for win rate, a ring for profit factor, a split bar
  // for average win vs loss.
  function _dial(id, cfg) {
    if (dials[id]) { dials[id].destroy(); delete dials[id]; }
    const el = document.getElementById(id);
    if (!el) return;
    dials[id] = new Chart(el.getContext('2d'), cfg);
  }

  function drawDials() {
    const b = DATA.book;
    const none = !b.trades;

    // Win rate — 180° gauge, green share = win rate.
    const wr = none ? 50 : b.win_rate;
    _dial('winGauge', {
      type: 'doughnut',
      data: { datasets: [{ data: [wr, 100 - wr],
              backgroundColor: none ? ['#262a38', '#262a38'] : ['#7FE098', '#ef5350'],
              borderWidth: 0, circumference: 180, rotation: 270 }] },
      // NO maintainAspectRatio:false here — the canvas would grow to fill a
      // container sized by the canvas itself, looping until the tile filled the page.
      options: { animation: false, cutout: '72%',
                 plugins: { legend: { display: false }, tooltip: { enabled: false } } },
    });

    // Profit factor — 1.0 (break-even) is a half ring, 2.0+ fills it. No losses
    // yet reads as a full green ring, matching the infinity in the value.
    const pf = b.profit_factor;
    const fill = none ? 0 : (pf == null ? 100 : Math.min(Math.max(pf / 2 * 100, 0), 100));
    _dial('pfRing', {
      type: 'doughnut',
      data: { datasets: [{ data: [fill, 100 - fill],
              backgroundColor: [(pf == null || pf >= 1) ? '#7FE098' : '#ef5350', '#1e2130'],
              borderWidth: 0 }] },
      options: { animation: false, cutout: '75%',
                 plugins: { legend: { display: false }, tooltip: { enabled: false } } },
    });

    // Avg win vs avg loss — segment widths in proportion to their magnitudes.
    const aw = Math.abs(b.avg_win || 0), al = Math.abs(b.avg_loss || 0);
    const tot = (aw + al) || 1;
    const ws = document.getElementById('wlWinSeg'), ls = document.getElementById('wlLossSeg');
    if (ws && ls) {
      ws.style.width = (aw / tot * 100).toFixed(1) + '%';
      ls.style.width = (al / tot * 100).toFixed(1) + '%';
    }
  }

  // Cumulative P&L from closed trades — the dashboard's curve, scoped to the recap
  // period and to Crew Paper. One point per closed trade, ordered by exit.
  function drawEquity() {
    const el = document.getElementById('eq');
    if (!el) return;
    if (eqChart) { eqChart.destroy(); eqChart = null; }
    const curve = (DATA.book && DATA.book.curve) || [];
    if (!curve.length) {
      const c = el.getContext('2d');
      c.clearRect(0, 0, el.width, el.height);
      c.fillStyle = '#555'; c.font = '13px DM Sans, sans-serif'; c.textAlign = 'center';
      c.fillText('No closed trades in this period', el.width / 2, 40);
      return;
    }
    eqChart = new Chart(el, {
      type: 'line',
      data: {
        labels: curve.map(p => p.date),
        datasets: [{
          data: curve.map(p => p.cum),
          borderColor: '#7FE098', borderWidth: 2,
          pointRadius: curve.length > 60 ? 0 : 2.5, pointBackgroundColor: '#7FE098',
          tension: 0.15,
          // Green above the zero line, red below — the shape reads at a glance.
          fill: { target: 'origin',
                  above: 'rgba(127,224,152,0.13)', below: 'rgba(224,138,138,0.13)' },
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (it) => {
                const p = curve[it[0].dataIndex];
                return `${p.date} ${_etHM(p.t)} ET`;
              },
              label: (it) => {
                const p = curve[it.dataIndex];
                return [`Cumulative ${money(p.cum)}`,
                        `${p.ticker || ''} ${money(p.pnl)}`,
                        String(p.strategy || '').replace(/_V02_5MIN$/, '')];
              },
            },
          },
        },
        scales: {
          x: { grid: { color: '#171a24' },
               ticks: { color: '#666', maxRotation: 0, autoSkip: true, maxTicksLimit: 8 } },
          y: { grid: { color: '#171a24' },
               ticks: { color: '#666', callback: (v) => money(v) } },
        },
      },
    });
  }

  // Top 3 + bottom 3, each charted on its biggest-move session. from == to so the
  // server fetches exactly that one session's bars/pivots rather than the window's.
  async function loadSixCharts() {
    const host = document.getElementById('sixCharts');
    if (!host) return;
    for (const c of miniCharts.splice(0)) { try { c.remove(); } catch (e) {} }
    SESSIONS.length = 0;

    // Explicit columns rather than one row-major grid: with a 2-col grid the 4th
    // card wraps under the 2nd, so winners and losers end up interleaved. Two
    // stacked columns also survive an uneven split (3 winners, 1 loser).
    const wins   = (DATA.winners || []).filter(p => p.chart_date);
    const losses = (DATA.losers  || []).filter(p => p.chart_date);
    if (!wins.length && !losses.length) {
      host.innerHTML = '<div class="empty">No strategies to chart.</div>'; return;
    }

    let idx = 0;
    const col = (picks, title, colour, kind) => {
      const cards = picks.map(p => {
        const i = idx++;
        SESSIONS[i] = { pick: p, ss: null };
        return `<div class="mini clickable" id="mini${i}" onclick="openChartModal(${i})"
                     title="Click to enlarge">
          <div class="mini-head">
            <span class="mini-name">${esc(p.name.replace(/_V02_5MIN$/, ''))}</span>
            <span class="mini-meta">${esc(p.chart_date)} · ${p.trades} tr</span>
            <span class="mini-pl ${kind === 'win' ? 'pos' : 'neg'}">${money(p.pnl)}</span>
            <button class="mini-zoom" onclick="event.stopPropagation();openChartModal(${i})">⤢</button>
          </div>
          <div class="mini-chart" id="mc${i}"><div class="empty">loading…</div></div>
        </div>`;
      }).join('') || '<div class="empty">None.</div>';
      return `<div class="chart-col">
        <div class="col-head" style="color:${colour}">${title}</div>${cards}</div>`;
    };

    host.innerHTML = '<div class="chart-cols">'
      + col(wins,   'Winners', '#7FE098', 'win')
      + col(losses, 'Losers',  '#e08a8a', 'loss')
      + '</div>';

    await Promise.all(SESSIONS.map(async (slot, i) => {
      const p  = slot.pick;
      const el = document.getElementById('mc' + i);
      try {
        const d = await fetch(`/api/strategy/day_charts?strategy=${encodeURIComponent(p.name)}`
                              + `&account=4&from=${p.chart_date}&to=${p.chart_date}&limit=1`)
                        .then(r => r.json());
        const ss = (d.sessions || [])[0];
        if (!ss || !(ss.bars || []).length) { el.innerHTML = '<div class="empty">No bars.</div>'; return; }
        slot.ss = ss;                       // cached so the modal never refetches
        el.innerHTML = '';
        miniCharts.push(makeChart(el, ss, 200));
      } catch (e) {
        el.innerHTML = '<div class="empty">failed</div>';
      }
    }));
  }

  // ── Enlarge ───────────────────────────────────────────────────────────────
  function openChartModal(i) {
    const slot = SESSIONS[i];
    if (!slot || !slot.ss) { _toast('Chart still loading'); return; }
    const { pick: p, ss } = slot;
    document.getElementById('mTitle').textContent = p.name.replace(/_V02_5MIN$/, '');
    document.getElementById('mMeta').textContent  =
      `${ss.date} · ${ss.ticker} · ${ss.n_trades} trade${ss.n_trades === 1 ? '' : 's'} · times ET`;
    const pl = document.getElementById('mPl');
    pl.textContent = money(p.pnl);
    pl.className = 'mini-pl ' + (p.pnl >= 0 ? 'pos' : 'neg');
    document.getElementById('mRows').innerHTML = '<tbody>' + (ss.rows || []).map(r => `<tr>
        <td style="color:${r.side === 'SHORT' ? '#e08a8a' : '#7FE098'}">${esc(r.side)}</td>
        <td style="color:#888">${esc(_etHM(r.entry_time))}&rarr;${esc(_etHM(r.exit_time))}</td>
        <td>${esc(r.qty)} @ ${r.entry_price == null ? '—' : Number(r.entry_price).toFixed(2)}</td>
        <td>exit ${r.exit_price == null ? '—' : Number(r.exit_price).toFixed(2)}</td>
        <td style="color:#888">${esc(r.exit_reason || '')}</td>
        <td class="${r.pnl >= 0 ? 'pos' : 'neg'}" style="text-align:right">${money(r.pnl)}</td>
      </tr>`).join('') + '</tbody>';

    document.getElementById('chartModal').classList.add('show');
    const el = document.getElementById('mChart');
    el.innerHTML = '';
    if (modalChart) { try { modalChart.remove(); } catch (e) {} modalChart = null; }
    // Build AFTER the modal is visible — a chart sized against a display:none
    // container comes out 0px wide.
    modalChart = makeChart(el, ss, el.clientHeight || 520);
  }

  function closeChartModal() {
    document.getElementById('chartModal').classList.remove('show');
    if (modalChart) { try { modalChart.remove(); } catch (e) {} modalChart = null; }
  }
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    closeChartModal();
    closeGateModal();
  });

  // ── Gate reference ────────────────────────────────────────────────────────
  // The Refusal table and the gate strip both name gates without saying what
  // they do. Every gate name on this page opens its rule here, next to what THIS

  async function loadGateDocs() {

      GATE_DOCS = await fetch('/api/gates/docs?account=alpaca4').then(r => r.json());
    } catch (e) {
      GATE_DOCS = null;      // modals degrade to a short message; the page still works
    }
  }

  const GATE_ALIASES = {
    'reversal side': 'reversal', 'opening location': 'open-location',
    'open location': 'open-location', 'profit lock': 'profit-lock',
    'daily loss': 'daily-loss', 'manual halt': 'manual-halt',
    'day type': 'day-type', 'trading hours': 'hours'
  };

  function gateKey(name) {
    const k = (name || '').trim().toLowerCase().replace(/_/g, '-');
    if (GATE_DOCS && GATE_DOCS.gates && GATE_DOCS.gates[k]) return k;
    return GATE_ALIASES[k.replace(/-/g, ' ')] || k;
  }

  function openGateModal(name) {
    const back = document.getElementById('gateModal');
    const g    = GATE_DOCS && GATE_DOCS.gates ? GATE_DOCS.gates[gateKey(name)] : null;
    document.getElementById('gmTitle').textContent = g ? g.title : (name || 'Gate');
    document.getElementById('gmFor').textContent   =
      GATE_DOCS ? `on ${GATE_DOCS.label}` : '';
    document.getElementById('gmBody').innerHTML = g ? `
      <div class="gm-state">
        <span class="pill ${g.on ? 'on' : 'off'}">${g.on ? '● live' : '○ off'}</span>
        <span style="color:#c3c9d6">${esc(g.setting)}</span>
        ${g.source === 'override' ? '<span class="gm-src">per-account override</span>' : ''}
      </div>
      <div class="gm-what">${esc(g.what)}</div>
      <div class="gm-h">The rule</div>
      <ul>${(g.rule || []).map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      <div class="gm-h">Why it exists</div>
      <div class="gm-why">${esc(g.why)}</div>
      ${g.answerable ? '' : `<div class="gm-note">${esc(g.no_control_note)}</div>`}`
      : `<div class="gm-what">No rule reference for "${esc(name)}".</div>`;
    back.classList.add('show');
  }

  function closeGateModal() {
    document.getElementById('gateModal').classList.remove('show');
  }

  // Shared candle-chart builder — same rendering as the Chart Review page.
  function makeChart(el, ss, height) {
    const c = LightweightCharts.createChart(el, {
      width: el.clientWidth, height,
      layout: { background: { color: '#0f1219' }, textColor: '#8a90a0', fontSize: 10 },
      grid: { vertLines: { color: '#171a24' }, horzLines: { color: '#171a24' } },
      rightPriceScale: { borderColor: '#2a2d3e' },
      timeScale: { borderColor: '#2a2d3e', timeVisible: true, secondsVisible: false,
                   tickMarkFormatter: (x) => _etTime.format(new Date(x * 1000)) },
      localization: { timeFormatter: (x) => _etFull.format(new Date(x * 1000)) },
      crosshair: { mode: 0 },
    });
    const series = c.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350', borderUpColor: '#26a69a',
      borderDownColor: '#ef5350', wickUpColor: '#26a69a', wickDownColor: '#ef5350' });
    series.setData(ss.bars.map(b => ({
      time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));
    if (ss.markers) series.setMarkers(ss.markers);
    for (const lv of (ss.levels || [])) {
      series.createPriceLine({ price: lv.price, color: lv.color, lineWidth: 1,
        lineStyle: lv.style === 'dashed' ? 2 : 0, axisLabelVisible: true, title: lv.title });
    }
    c.timeScale().fitContent();
    new ResizeObserver(() => c.applyOptions({ width: el.clientWidth })).observe(el);
    return c;
  }

  function toggleScript() {
    const body = document.getElementById('scriptBody');
    const btn  = document.getElementById('scriptToggle');
    if (!body || !btn) return;
    const open = body.classList.toggle('open');
    btn.textContent = open ? 'Hide script notes' : 'Show script notes';
  }

  function copyScript() {
    if (!DATA) { _toast('Nothing to copy'); return; }
    const b = DATA.book;
    const lines = [
      `KAIROS RECAP — ${DATA.label} — ${DATA.week_label}`,
      `(paper trading — say this out loud)`, '',
      ...(DATA.script || []).map(x => `${x.segment}\n  ${x.line}`),
      '', 'NUMBERS',
      `  Week P&L: ${money(b.pnl)} over ${b.trades} trades, ${b.win_rate.toFixed(1)}% win`,
      `  Best day: ${b.best_day ? b.best_day[0] + ' ' + money(b.best_day[1]) : '—'}`,
      `  Worst day: ${b.worst_day ? b.worst_day[0] + ' ' + money(b.worst_day[1]) : '—'}`,
      '  Winners: ' + ((DATA.winners || []).map(w => `${w.name} ${money(w.pnl)}`).join(', ') || 'none'),
      '  Losers:  ' + ((DATA.losers || []).map(w => `${w.name} ${money(w.pnl)}`).join(', ') || 'none'),
      '  Gates live: ' + (DATA.gates || []).filter(g => g.on).map(g => g.gate).join(', '),
      '  Gates off:  ' + (DATA.gates || []).filter(g => !g.on).map(g => g.gate).join(', '),
    ];
    const bk = GATES && (GATES.books || [])[0];
    if (bk) {
      lines.push('', `THE REFUSAL (${GATES.from} -> ${GATES.to})`,
        `  ${bk.total_blocks} blocks` + (bk.est_dollars_total != null
          ? `, est. ${money(bk.est_dollars_total)} of P&L refused` : ''),
        ...(bk.by_gate || []).map(g => `  ${g.gate}: ${g.blocked} blocked` +
          (g.unanswerable ? ' (no control group)'
            : `, ${g.matched} matched, avg ${g.avg_pct}%` +
              (g.est_dollars == null ? '' : `, est ${money(g.est_dollars)}`))));
    }
    const text = lines.join('\n');
    const done = () => _toast('Script copied');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => _fallbackCopy(text, done));
    } else { _fallbackCopy(text, done); }
  }
  function _fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { _toast('Copy failed'); }
    document.body.removeChild(ta);
  }

  load();
</script>
</body>
</html>
