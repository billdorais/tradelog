<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chart Review — Kairos Automata</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1117; color: #e0e0e0; font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    .nav { display: flex; align-items: center; justify-content: space-between;
           padding: 12px 24px; background: #13161f; border-bottom: 1px solid #1e2130; }
    .page { max-width: 1300px; margin: 0 auto; padding: 28px 24px; }
    h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .sub { color: #666; font-size: 0.85rem; margin-bottom: 20px; }

    /* Controls */
    .controls { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
    .field label { display: block; font-size: 0.73rem; color: #888; margin-bottom: 4px; }
    .field input { background: #13152a; border: 1px solid #2a2d3e; border-radius: 6px;
                   color: #e0e0e0; padding: 7px 10px; font-size: 0.88rem; font-family: inherit; }
    .field input:focus { outline: none; border-color: #7FE098; }
    .nudge { background: transparent; border: 1px solid #2a2d3e; color: #aaa; border-radius: 6px;
             padding: 7px 12px; font-size: 0.95rem; cursor: pointer; font-family: inherit; line-height: 1; }
    .nudge:hover { border-color: #7FE098; color: #ccc; }
    .run-btn { background: #88BF8B; color: #fff; border: none; border-radius: 6px;
               padding: 8px 22px; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .run-btn:hover { background: #357abd; }
    .run-btn:disabled { background: #2a2d3e; color: #555; cursor: not-allowed; }

    /* Summary stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                  gap: 10px; margin-bottom: 24px; }
    .stat-card { background: #1c1f2e; border: 1px solid #2a2d3e; border-radius: 8px; padding: 13px 15px; }
    .stat-lbl { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
    .stat-val { font-size: 1.15rem; font-weight: 700; }
    .pos { color: #7FE098; } .neg { color: #ef5350; }

    /* Ticker chart block */
    .tk-card { background: #1c1f2e; border: 1px solid #2a2d3e; border-radius: 10px;
               overflow: hidden; margin-bottom: 22px; }
    .tk-head { display: flex; align-items: center; justify-content: space-between;
               padding: 13px 18px; border-bottom: 1px solid #2a2d3e; }
    .tk-sym { font-size: 1.05rem; font-weight: 700; }
    .tk-meta { font-size: 0.8rem; color: #888; }
    .tk-pnl { font-size: 1.0rem; font-weight: 700; }
    .chart-container { width: 100%; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { padding: 8px 14px; text-align: left; color: #666; font-weight: 600; font-size: 0.7rem;
         text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid #2a2d3e; white-space: nowrap; }
    td { padding: 7px 14px; border-bottom: 1px solid #1a1d2e; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    .long-badge  { background: rgba(81,115,86,0.15); color: #7FE098; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
    .short-badge { background: rgba(239,83,80,0.15); color: #ef5350; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }

    .status { padding: 11px 16px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 16px; display: none; }
    .status.info  { background: rgba(136,191,139,0.12); color: #7FE098; border: 1px solid rgba(74,144,217,0.25); display: block; }
    .status.error { background: rgba(239,83,80,0.12);  color: #ef5350; border: 1px solid rgba(239,83,80,0.25); display: block; }
    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor;
               border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite;
               vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 50px 20px; color: #444; font-size: 0.9rem; }

    /* Data-driven read */
    .read { padding: 11px 18px; border-bottom: 1px solid #2a2d3e; background: #181b29; }
    .read-verdict { font-size: 0.85rem; font-weight: 700; color: #e8c46b; margin-bottom: 5px; }
    .read ul { margin: 0; padding-left: 17px; }
    .read li { font-size: 0.8rem; color: #b9bdc9; margin: 2px 0; line-height: 1.45; }

    /* Two-strikes week panel */
    .ts-card { background: #1c1f2e; border: 1px solid #517356; border-radius: 10px;
               padding: 16px 20px; margin-bottom: 22px; }
    .ts-card h3 { font-size: 0.95rem; margin-bottom: 4px; }
    .ts-sub { color: #777; font-size: 0.78rem; margin-bottom: 14px; }
    .ts-head { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
               gap: 10px; margin-bottom: 14px; }
  </style>
</head>
<body>
<nav class="nav">
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="display:inline-flex"><img src="/static/kariosLogo_128.png" alt="Home" style="height:36px;width:36px;image-rendering:pixelated;cursor:pointer"></a>
    <span style="font-size:1.1rem;font-weight:600;color:#e0e0e0">Kairos Automata — Chart Review</span>
  </div>
  <div style="position:relative;display:inline-block">
    <button id="navMenuBtn" onclick="toggleNavMenu()" style="background:transparent;border:1px solid #2a2d3e;color:#aaa;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:1.1rem;line-height:1">&#9776;</button>
    <div id="navMenu" style="display:none;position:absolute;top:calc(100% + 6px);right:0;background:#1a1d2e;border:1px solid #2a2d3e;border-radius:6px;min-width:180px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.4)">
      <a href="/" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#127968; Dashboard</a>
      <a href="/routing" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128257; Signal Router</a>
      <a href="/analysis" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128300; Analysis</a>
      <a href="/review" style="display:block;padding:10px 16px;color:#7FE098;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128202; Chart Review</a>
      <a href="/strategies" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128200; Strategies</a>
      <a href="/optimize" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128269; Optimizer</a>
      <a href="/progress" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#9989; Progress</a>
      <a href="/research" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#129514; Research</a>
      <a href="/journal" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128221; Journal</a>
      <a href="/simulate" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#127916; Replay</a>
        <a href="/strategy-explorer" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128202; Strategy Explorer</a>
      <a href="/recap" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#127916; Recap</a>
        <a href="/crew" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#10022; Crew</a>
      <a href="/about" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem">&#8505; About</a>
    </div>
  </div>
</nav>

<div class="page">
  <h2>Chart Review</h2>
  <div class="sub" id="reviewSub">Refined account · 5-minute bars with entry/exit markers · times shown in ET</div>

  <div class="controls">
    <div class="field">
      <label for="acctSelect">Entries</label>
      <select id="acctSelect" onchange="load()"
        style="background:#0f1117;color:#e0e0e0;border:1px solid #2a2d3e;border-radius:6px;padding:6px 10px;font-size:0.9rem;cursor:pointer">
        <option value="2">Refined (TV entries)</option>
        <option value="3">Kairos (engine entries)</option>
      </select>
    </div>
    <button class="nudge" onclick="nudgeDay(-1)" title="Previous day">&#8592;</button>
    <div class="field">
      <label for="dateInput">Date</label>
      <input type="date" id="dateInput">
    </div>
    <button class="nudge" onclick="nudgeDay(1)" title="Next day">&#8594;</button>
    <button class="run-btn" id="loadBtn" onclick="load()">Load</button>
    <div class="field" style="margin-left:18px">
      <label for="strikesInput">Strikes / level</label>
      <input type="number" id="strikesInput" value="2" min="1" max="9" style="width:70px" onchange="load()">
    </div>
    <button class="run-btn" id="weekBtn" onclick="analyzeWeek()" style="background:#517356">Two-strikes: analyze week</button>
  </div>

  <div id="status" class="status"></div>
  <div id="summary" class="stats-grid" style="display:none"></div>
  <div id="tsResult"></div>
  <div id="charts"></div>
</div>

<script>
  const _charts = [];

  function toggleNavMenu() {
    const m = document.getElementById('navMenu');
    m.style.display = m.style.display === 'none' ? 'block' : 'none';
  }
  document.addEventListener('click', e => {
    const menu = document.getElementById('navMenu');
    const btn  = document.getElementById('navMenuBtn');
    if (menu && !menu.contains(e.target) && e.target !== btn) menu.style.display = 'none';
  });

  // Format a Unix-second timestamp (UTC) as ET time/date for axis labels & tooltips.
  const _etTime = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false });
  const _etFull = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: false });

  function setStatus(msg, kind) {
    const el = document.getElementById('status');
    el.className = 'status ' + (kind || 'info');
    el.innerHTML = msg;
  }
  function clearStatus() { document.getElementById('status').className = 'status'; }

  function fmtMoney(v) {
    const n = Number(v) || 0;
    return (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2);
  }
  function pnlClass(v) { return (Number(v) || 0) >= 0 ? 'pos' : 'neg'; }

  function nudgeDay(delta) {
    const inp = document.getElementById('dateInput');
    const d = new Date(inp.value + 'T12:00:00');
    d.setDate(d.getDate() + delta);
    inp.value = d.toISOString().slice(0, 10);
    load();
  }

  function destroyCharts() {
    for (const c of _charts) { try { c.remove(); } catch (e) {} }
    _charts.length = 0;
  }

  function renderTickerCard(tk) {
    const card = document.createElement('div');
    card.className = 'tk-card';

    const head = document.createElement('div');
    head.className = 'tk-head';
    const firstET = tk.first_entry
      ? _etTime.format(new Date((tk.first_entry).replace(' ', 'T'))) + ' ET'
      : '';
    head.innerHTML =
      `<div><span class="tk-sym">${tk.ticker}</span> ` +
      `<span class="tk-meta">&nbsp;${tk.n_trades} trade${tk.n_trades === 1 ? '' : 's'}` +
      (firstET ? ` &middot; first ${firstET}` : '') + `</span></div>` +
      `<div class="tk-pnl ${pnlClass(tk.total_pnl)}">${fmtMoney(tk.total_pnl)}</div>`;
    card.appendChild(head);

    // Data-driven read
    if (tk.read && (tk.read.verdict || (tk.read.notes && tk.read.notes.length))) {
      const rd = document.createElement('div');
      rd.className = 'read';
      const notes = (tk.read.notes || []).map(n => `<li>${n}</li>`).join('');
      rd.innerHTML =
        (tk.read.verdict ? `<div class="read-verdict">📋 ${tk.read.verdict}</div>` : '') +
        (notes ? `<ul>${notes}</ul>` : '');
      card.appendChild(rd);
    }

    const chartDiv = document.createElement('div');
    chartDiv.className = 'chart-container';
    card.appendChild(chartDiv);

    // Per-trade table
    if (tk.trades && tk.trades.length) {
      const wrap = document.createElement('div');
      wrap.style.overflowX = 'auto';
      let rows = '';
      for (const t of tk.trades) {
        const isLong = (t.side || '').toUpperCase() === 'LONG';
        rows +=
          `<tr>` +
          `<td><span class="${isLong ? 'long-badge' : 'short-badge'}">${isLong ? 'Long' : 'Short'}</span></td>` +
          `<td style="color:#999">${t.strategy || ''}</td>` +
          `<td>${t.qty}</td>` +
          `<td>${_etTime.format(new Date((t.entry_time || '').replace(' ', 'T')))} @ ${t.entry_price}</td>` +
          `<td>${_etTime.format(new Date((t.exit_time || '').replace(' ', 'T')))} @ ${t.exit_price}</td>` +
          `<td style="color:#777">${t.exit_reason || ''}</td>` +
          `<td class="${pnlClass(t.pnl)}" style="font-weight:600">${fmtMoney(t.pnl)}</td>` +
          `</tr>`;
      }
      wrap.innerHTML =
        `<table><thead><tr>` +
        `<th>Side</th><th>Strategy</th><th>Qty</th><th>Entry (ET)</th><th>Exit (ET)</th><th>Exit Reason</th><th>P&amp;L</th>` +
        `</tr></thead><tbody>${rows}</tbody></table>`;
      card.appendChild(wrap);
    }

    document.getElementById('charts').appendChild(card);

    if (!tk.ohlcv || !tk.ohlcv.length) {
      const note = document.createElement('div');
      note.className = 'empty';
      note.style.padding = '30px';
      note.textContent = 'No price bars available for this symbol/day.';
      chartDiv.appendChild(note);
      return;
    }

    const chart = LightweightCharts.createChart(chartDiv, {
      width:  chartDiv.clientWidth,
      height: 420,
      layout:    { background: { color: '#13152a' }, textColor: '#888' },
      grid:      { vertLines: { color: '#1e2130' }, horzLines: { color: '#1e2130' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: '#2a2d3e' },
      timeScale: {
        borderColor: '#2a2d3e', timeVisible: true, secondsVisible: false,
        tickMarkFormatter: (t) => _etTime.format(new Date(t * 1000)),
      },
      localization: {
        timeFormatter: (t) => _etFull.format(new Date(t * 1000)),
      },
    });
    const candles = chart.addCandlestickSeries({
      upColor: '#7FE098', downColor: '#ef5350',
      borderUpColor: '#7FE098', borderDownColor: '#ef5350',
      wickUpColor: '#7FE098', wickDownColor: '#ef5350',
    });
    candles.setData(tk.ohlcv);
    if (tk.markers && tk.markers.length) candles.setMarkers(tk.markers);

    // 8-EMA overlay (the strategies' trend filter)
    const emaData = tk.ohlcv.filter(b => b.ema != null)
                            .map(b => ({ time: b.time, value: b.ema }));
    if (emaData.length) {
      const emaSeries = chart.addLineSeries({
        color: '#e0e0e0', lineWidth: 2, priceLineVisible: false,
        lastValueVisible: false, crosshairMarkerVisible: false,
      });
      emaSeries.setData(emaData);
    }

    // Camarilla pivot levels (R3/S3, R4/S4, DP) as horizontal price lines
    if (tk.levels && tk.levels.length) {
      for (const L of tk.levels) {
        candles.createPriceLine({
          price:            L.price,
          color:            L.color,
          lineWidth:        1,
          lineStyle:        L.style === 'dashed' ? LightweightCharts.LineStyle.Dashed
                                                  : LightweightCharts.LineStyle.Solid,
          axisLabelVisible: true,
          title:            L.title,
        });
      }
    }

    chart.timeScale().fitContent();
    _charts.push(chart);
  }

  function strikesVal() {
    return Math.max(1, parseInt(document.getElementById('strikesInput').value, 10) || 2);
  }

  function acctVal()   { return document.getElementById('acctSelect').value || '2'; }
  function acctLabel()  { return acctVal() === '3' ? 'Kairos' : 'Refined'; }

  async function load() {
    const date    = document.getElementById('dateInput').value;
    const strikes = strikesVal();
    const account = acctVal();
    const btn     = document.getElementById('loadBtn');
    // Two-strikes is a Refined-account gating analysis — hide it for Kairos.
    const wkBtn = document.getElementById('weekBtn');
    if (wkBtn) wkBtn.style.display = account === '3' ? 'none' : '';
    const sub = document.getElementById('reviewSub');
    if (sub) sub.textContent = (account === '3' ? 'Kairos engine account' : 'Refined account')
      + ' · 5-minute bars with entry/exit markers · times shown in ET';
    btn.disabled = true;
    destroyCharts();
    document.getElementById('charts').innerHTML = '';
    document.getElementById('summary').style.display = 'none';
    document.getElementById('tsResult').innerHTML = '';
    setStatus(`<span class="spinner"></span>Loading ${acctLabel()} trades & bars…`, 'info');

    try {
      const r = await fetch(`/api/review?date=${encodeURIComponent(date)}&strikes=${strikes}&account=${account}`);
      const data = await r.json();
      if (!r.ok) { setStatus(data.error || 'Failed to load.', 'error'); btn.disabled = false; return; }

      if (!data.n_trades) {
        clearStatus();
        document.getElementById('charts').innerHTML =
          `<div class="empty">No completed ${data.account || acctLabel()} round-trips on ${data.date}.</div>`;
        btn.disabled = false;
        return;
      }

      clearStatus();
      const saved = data.two_strikes_saved || 0;
      const s = document.getElementById('summary');
      s.style.display = 'grid';
      s.innerHTML =
        `<div class="stat-card"><div class="stat-lbl">Entries</div><div class="stat-val" style="color:${data.account_id === '3' ? '#F2C07A' : '#a78bfa'};font-size:1rem">${data.account || acctLabel()}</div></div>` +
        `<div class="stat-card"><div class="stat-lbl">Date</div><div class="stat-val">${data.date}</div></div>` +
        `<div class="stat-card"><div class="stat-lbl">Day P&amp;L</div><div class="stat-val ${pnlClass(data.total_pnl)}">${fmtMoney(data.total_pnl)}</div></div>` +
        `<div class="stat-card"><div class="stat-lbl">Round-trips</div><div class="stat-val">${data.n_trades}</div></div>` +
        `<div class="stat-card"><div class="stat-lbl">Tickers</div><div class="stat-val">${data.n_tickers}</div></div>` +
        `<div class="stat-card"><div class="stat-lbl">${data.strikes}-strikes saves</div>` +
        `<div class="stat-val ${saved >= 0 ? 'pos' : 'neg'}">${fmtMoney(saved)}</div></div>`;

      for (const tk of data.tickers) renderTickerCard(tk);
    } catch (e) {
      setStatus('Error: ' + e.message, 'error');
    }
    btn.disabled = false;
  }

  async function analyzeWeek() {
    const strikes = strikesVal();
    const btn = document.getElementById('weekBtn');
    btn.disabled = true;
    const out = document.getElementById('tsResult');
    out.innerHTML = `<div class="ts-card"><span class="spinner"></span>Replaying the week…</div>`;
    try {
      const r = await fetch(`/api/review/two_strikes?strikes=${strikes}`);
      const d = await r.json();
      if (!r.ok) { out.innerHTML = `<div class="ts-card neg">${d.error || 'Failed.'}</div>`; btn.disabled = false; return; }

      const rows = (d.by_level || []).map(b =>
        `<tr><td>${b.key}</td><td>${b.blocked}</td>` +
        `<td class="${b.saved >= 0 ? 'pos' : 'neg'}" style="font-weight:600">${fmtMoney(b.saved)}</td></tr>`).join('');
      const days = (d.per_day || []).map(p =>
        `<tr><td>${p.date}</td><td class="${p.saved >= 0 ? 'pos' : 'neg'}" style="font-weight:600">${fmtMoney(p.saved)}</td></tr>`).join('');

      out.innerHTML =
        `<div class="ts-card">` +
        `<h3>${d.strikes}-strikes-per-level rule — ${d.from} → ${d.to}</h3>` +
        `<div class="ts-sub">Refined account · blocks trades on a ticker-level after ${d.strikes} losses that day</div>` +
        `<div class="ts-head">` +
          `<div class="stat-card"><div class="stat-lbl">Actual P&amp;L</div><div class="stat-val ${pnlClass(d.actual_pnl)}">${fmtMoney(d.actual_pnl)}</div></div>` +
          `<div class="stat-card"><div class="stat-lbl">Would have saved</div><div class="stat-val ${d.saved >= 0 ? 'pos' : 'neg'}">${fmtMoney(d.saved)}</div></div>` +
          `<div class="stat-card"><div class="stat-lbl">Adjusted P&amp;L</div><div class="stat-val ${pnlClass(d.adjusted_pnl)}">${fmtMoney(d.adjusted_pnl)}</div></div>` +
          `<div class="stat-card"><div class="stat-lbl">Trades skipped</div><div class="stat-val">${d.trades_blocked} / ${d.n_trades}</div></div>` +
        `</div>` +
        (days ? `<div style="overflow-x:auto;margin-bottom:14px"><table><thead><tr><th>Day</th><th>Saved</th></tr></thead><tbody>${days}</tbody></table></div>` : '') +
        (rows ? `<div style="overflow-x:auto"><table><thead><tr><th>Ticker · Level</th><th>Trades skipped</th><th>Saved</th></tr></thead><tbody>${rows}</tbody></table></div>`
              : `<div class="ts-sub">No level hit ${d.strikes} losses in this range — nothing would have been blocked.</div>`) +
        `</div>`;
    } catch (e) {
      out.innerHTML = `<div class="ts-card neg">Error: ${e.message}</div>`;
    }
    btn.disabled = false;
  }

  window.addEventListener('resize', () => {
    // Re-fit width of each chart to its container
    document.querySelectorAll('.chart-container').forEach((el, i) => {
      if (_charts[i]) _charts[i].applyOptions({ width: el.clientWidth });
    });
  });

  // Default to today (ET) and auto-load
  (function init() {
    const etToday = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
    document.getElementById('dateInput').value = etToday;
    load();
  })();
</script>
