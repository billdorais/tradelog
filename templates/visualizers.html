<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizers · Kairos</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#06070c; color:#cdd6e6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #glow { position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 24%, rgba(80,120,200,0.12), rgba(6,7,12,0) 60%); }
  #stage { position:fixed; inset:0; z-index:1; }
  canvas { display:block; }

  .topbar { position:fixed; top:0; left:0; right:0; z-index:6; display:flex; align-items:center; gap:14px; padding:12px 18px; }
  .brand { font-weight:700; letter-spacing:0.02em; color:#e6eaf5; }
  .brand small { color:#6f7a99; }
  .nav-link { color:#8a90a2; text-decoration:none; font-size:0.82rem; padding:5px 10px;
    border:1px solid #232840; border-radius:6px; background:rgba(18,21,29,0.6); }
  .nav-link:hover { color:#cdd6e6; border-color:#3a4a6a; }

  .title { position:fixed; z-index:6; top:14px; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; }
  .title h1 { margin:0; font-size:1.0rem; font-weight:800; letter-spacing:0.06em; color:#e6eaf5; text-transform:uppercase; }
  .title .sub { font-size:0.74rem; color:#7c8399; margin-top:2px; }
  .live-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#38e08a;
    box-shadow:0 0 8px #38e08a; margin-right:5px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .legend { position:fixed; z-index:6; top:14px; right:18px; font-size:0.72rem; color:#8a90a2;
    display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .legend span { display:inline-flex; align-items:center; }
  .legend i { display:inline-block; width:26px; height:5px; border-radius:3px; margin-right:6px; }

  .panel { position:fixed; z-index:6; bottom:16px; left:16px; background:rgba(12,14,20,0.82);
    border:1px solid #222840; border-radius:10px; padding:12px 14px; backdrop-filter:blur(6px); max-width:min(94vw,620px); }
  .panel .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .panel label { font-size:0.68rem; color:#7c8399; }
  .panel input[type=text], .panel input[type=date] { background:#0c0f16; border:1px solid #2a3050;
    color:#e0e0e0; border-radius:6px; padding:6px 9px; font-size:0.8rem; font-family:inherit; }
  .panel input#vizIndexes { width:150px; } .panel input#vizRefined { width:170px; }
  .btn { background:#182038; border:1px solid #2f3a63; color:#cfe0ff; border-radius:6px; padding:6px 13px; font-size:0.8rem; cursor:pointer; }
  .btn:hover { background:#202a4a; }
  .toggle { font-size:0.76rem; color:#9aa2b8; display:inline-flex; align-items:center; gap:5px; cursor:pointer; }

  .vlabel { font:600 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; white-space:nowrap;
    pointer-events:none; padding:1px 6px; border-radius:5px; background:rgba(10,12,20,0.55);
    border:1px solid rgba(160,190,255,0.18); text-shadow:0 0 6px rgba(0,0,0,0.9); }
  .vlabel b { color:#fff; } .vlabel span { opacity:0.8; margin-left:4px; }
  .vlabel.grp { font-size:0.66rem; letter-spacing:0.16em; font-weight:800; background:none; border:none; }
  .vlabel.open { color:#c9d4ff; }
  /* RVOL emphasis: <1.5x small/grey → >=3x large/glowing */
  .vlabel.rv1 { font-size:9px; color:#8b91a3; opacity:0.6; }
  .vlabel.rv2 { font-size:11px; }
  .vlabel.rv3 { font-size:13px; color:#ffe08a; border-color:rgba(255,205,130,0.55); }
  .vlabel.rv3 b { color:#fff5db; }
  .vlabel.rv4 { font-size:15.5px; color:#fff; border-color:rgba(255,170,220,0.75);
    box-shadow:0 0 14px rgba(255,120,200,0.45); text-shadow:0 0 10px rgba(255,120,200,0.85); }

  #overlay { position:fixed; inset:0; z-index:8; display:flex; align-items:center; justify-content:center;
    background:#06070c; color:#8a90a2; font-size:0.9rem; text-align:center; padding:24px; }
  #overlay.err { color:#e08a8a; }
</style>

<div id="glow"></div>
<div id="stage"></div>

<div class="topbar">
  <span class="brand">◆ Kairos <small>Visualizers</small></span>
  <a class="nav-link" href="/">← Dashboard</a>
</div>

<div class="title">
  <h1 id="vizTitle">Price Timelines</h1>
  <div class="sub" id="vizSub">loading…</div>
</div>

<div class="legend">
  <span><i style="background:linear-gradient(90deg,#22d3ee,#818cf8)"></i>indexes · back</span>
  <span><i style="background:linear-gradient(90deg,#fbbf24,#f472b6)"></i>refined · front</span>
  <span style="color:#5b6a85;font-size:0.64rem">height = RVOL (crosses the 1.5/2/3× lines) · tag = RVOL % · grey = &lt;1.5× · dim = pre-market</span>
</div>

<div class="panel">
  <div class="row">
    <div><label>Indexes</label><br><input type="text" id="vizIndexes" placeholder="SPY,QQQ,SMH"></div>
    <div><label>Refined</label><br><input type="text" id="vizRefined" placeholder="blank = refined books"></div>
    <div><label>Session</label><br><input type="date" id="vizDate"></div>
    <button class="btn" id="vizReload">Render</button>
  </div>
  <div class="row" style="margin-top:10px">
    <label class="toggle">height:
      <select id="vizMetric" style="background:#0c0f16;border:1px solid #2a3050;color:#cfe0ff;border-radius:6px;padding:4px 7px;font-size:0.78rem;font-family:inherit;cursor:pointer">
        <option value="rvol" selected>RVOL</option>
        <option value="volume">volume</option>
        <option value="price">price</option>
      </select></label>
    <label class="toggle"><input type="checkbox" id="vizLive" checked> live</label>
    <label class="toggle"><input type="checkbox" id="vizRotate"> auto-rotate</label>
    <label class="toggle"><input type="checkbox" id="vizGrid" checked> grid</label>
    <label class="toggle"><input type="checkbox" id="vizLabels" checked> labels</label>
  </div>
</div>

<div id="overlay">Loading Three.js…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
  import { Line2 } from 'three/addons/lines/Line2.js';
  import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
  import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

  const overlay = document.getElementById('overlay');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x06070c, 0.0011);
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 5000);
  camera.position.set(6, 62, 285);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('stage').appendChild(renderer.domElement);

  const labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(innerWidth, innerHeight);
  Object.assign(labelRenderer.domElement.style, { position:'fixed', top:'0', left:'0', pointerEvents:'none', zIndex:'4' });
  document.body.appendChild(labelRenderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.06;
  controls.autoRotateSpeed = 0.45; controls.target.set(0, 2, 8);
  controls.minDistance = 70; controls.maxDistance = 900;

  const WIDTH = 300, BAND = 52, AXIS = 720, LANE = 14;   // LANE = Z gap between tickers
  // Colour-ways: cool for indexes, warm for refined (low price → high price).
  const PAL = {
    index:   { lo: new THREE.Color(0x22d3ee), hi: new THREE.Color(0x818cf8), mk: 0x9fb4ff, back: true  },
    refined: { lo: new THREE.Color(0xfbbf24), hi: new THREE.Color(0xf472b6), mk: 0xffc4e6, back: false },
  };
  const COL_FUT = new THREE.Color(0x39415e);
  let group = null, rvolMax = 6;   // fixed RVOL height scale

  const xFor = t => (t / AXIS) * WIDTH - WIDTH / 2;

  function clearScene() {
    if (group) {
      group.traverse(o => { o.geometry?.dispose?.(); o.material?.dispose?.(); });
      scene.remove(group);
    }
    // Wipe every label DOM node — otherwise a de-anchored label stops being
    // re-projected and freezes at its last screen position (looks "stuck to the
    // camera" as you orbit). CSS2DRenderer re-appends the fresh labels on next render.
    labelRenderer.domElement.replaceChildren();
    group = new THREE.Group(); scene.add(group);
  }
  function mkLabel(cls, html, x, y, z) {
    const el = document.createElement('div'); el.className = 'vlabel ' + cls; el.innerHTML = html;
    const o = new CSS2DObject(el); o.position.set(x, y, z); group.add(o); return o;
  }

  function fmtVol(v) {
    if (v == null) return '—';
    if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
    if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
    return '' + v;
  }

  const GREY = new THREE.Color(0x565c70);
  // RVOL → colour saturation: <1.5x greyed out, 1.5x = 75%, >=2x = full.
  function rvolSat(rvol) {
    if (rvol < 1.5) return 0.12;
    if (rvol < 2.0) return 0.75 + (rvol - 1.5) / 0.5 * 0.25;
    return 1.0;
  }

  function buildLine(s, pal, z) {
    const pts = s.points || []; if (!pts.length) return;
    const metric = document.getElementById('vizMetric').value;
    const valOf = pt => metric === 'rvol' ? (pt.r ?? 0) : metric === 'volume' ? pt.v : pt.p;
    // RVOL uses a SHARED 0→rvolMax scale (so 1.5/2/3× line up across tickers);
    // price/volume normalise per-ticker.
    let lo, hi;
    if (metric === 'rvol')        { lo = 0; hi = rvolMax; }
    else if (metric === 'volume') { lo = s.vol_min ?? 0; hi = s.vol_max ?? 1; }
    else                          { lo = s.price_min; hi = s.price_max; }
    if (hi === lo) hi = lo + 1;
    const yFor = v => ((v - lo) / (hi - lo)) * BAND - BAND / 2;

    const rvol = s.rvol ?? 0, sat = rvolSat(rvol);
    const clampY = v => metric === 'rvol' ? Math.min(v, hi) : v;           // spikes flat-top at the scale max
    const verts = [], cols = [];
    for (const pt of pts) {
      const val = valOf(pt), n = Math.max(0, Math.min(1, (val - lo) / (hi - lo)));
      const c = GREY.clone().lerp(pal.lo.clone().lerp(pal.hi, n), sat);     // gradient by height, de-sat by RVOL
      if (pt.s === 'pre') c.multiplyScalar(0.5);                            // pre-market dimmer
      verts.push(xFor(pt.t), yFor(clampY(val)), z);
      cols.push(c.r, c.g, c.b);
    }
    const last = pts[pts.length - 1];
    if (last.t < AXIS - 1) { verts.push(xFor(AXIS), yFor(clampY(valOf(last))), z); cols.push(COL_FUT.r, COL_FUT.g, COL_FUT.b); }

    const lw = rvol < 1.5 ? 1.0 : rvol < 2 ? 1.4 : rvol < 3 ? 1.8 : 2.2;    // hotter = a touch thicker (thin overall)
    const g = new LineGeometry(); g.setPositions(verts); g.setColors(cols);
    const m = new LineMaterial({ linewidth: lw, vertexColors: true, transparent: true });
    m.resolution.set(innerWidth, innerHeight);
    const line = new Line2(g, m); line.computeLineDistances(); group.add(line);

    const rvClass = rvol < 1.5 ? 'rv1' : rvol < 2 ? 'rv2' : rvol < 3 ? 'rv3' : 'rv4';
    const tag = metric === 'price' ? '$' + (s.last_price ?? 0).toFixed(2) : `${Math.round(rvol * 100)}%`;
    mkLabel(rvClass, `<b>${s.ticker}</b><span>${tag}</span>`, xFor(last.t) + 3, yFor(clampY(valOf(last))) + 2.5, z);
  }

  function buildGroup(list, name, pal) {
    if (!list.length) return 0;
    const zBase = pal.back ? -18 : 26, dir = pal.back ? -1 : 1;
    list.forEach((s, i) => buildLine(s, pal, zBase + dir * i * LANE));
    const zc = zBase + dir * (list.length - 1) * LANE / 2;
    mkLabel('grp', `<span style="color:#${pal.hi.getHexString()}">${name}</span>`, xFor(0) - 20, BAND / 2 + 10, zc);
    return zBase + dir * (list.length - 1) * LANE;
  }

  function buildDecor() {
    const xo = xFor(330);
    if (document.getElementById('vizGrid').checked) {
      const grid = new THREE.GridHelper(WIDTH, 24, 0x1b2236, 0x0f1420);
      grid.position.y = -BAND / 2 - 2; grid.material.transparent = true; grid.material.opacity = 0.45; group.add(grid);
    }
    // 09:30 open — a thin line + label (no filled plane).
    const ln = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xo, -BAND / 2, 4), new THREE.Vector3(xo, BAND / 2, 4)]),
      new THREE.LineBasicMaterial({ color: 0x33507a, transparent: true, opacity: 0.4 }));
    group.add(ln);
    mkLabel('open', '9:30', xo, BAND / 2 + 5, 4);
  }

  function buildRefLevels() {
    // Thin outline rectangles at the 1.5 / 2 / 3× RVOL gate levels — no grey fill.
    const yFor = r => (r / rvolMax) * BAND - BAND / 2;
    const levels = [[1.5, 0x3a6ea5], [2.0, 0xa5892b], [3.0, 0xa53a6a]];
    const zA = -52, zB = 104;
    for (const [r, col] of levels) {
      if (r > rvolMax) continue;
      const y = yFor(r);
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-WIDTH / 2, y, zA), new THREE.Vector3(WIDTH / 2, y, zA),
        new THREE.Vector3(WIDTH / 2, y, zB), new THREE.Vector3(-WIDTH / 2, y, zB), new THREE.Vector3(-WIDTH / 2, y, zA)]);
      group.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.35 })));
      mkLabel('open', `${r}×`, -WIDTH / 2 - 8, y, zA);
    }
  }

  function build(d) {
    clearScene();
    const gi = (d.groups && d.groups.index) || [], gr = (d.groups && d.groups.refined) || [];
    if (!gi.length && !gr.length) { overlay.className = ''; overlay.textContent = 'No price data for this session yet.'; overlay.style.display = 'flex'; return; }
    // Fixed RVOL height scale so the 1.5/2/3× levels always sit at readable heights;
    // taller pre-market spikes flat-top at the max (their true % still shows in the tag).
    rvolMax = 6;
    buildDecor();
    if (document.getElementById('vizMetric').value === 'rvol') buildRefLevels();
    buildGroup(gi, 'INDEXES', PAL.index);
    buildGroup(gr, 'REFINED', PAL.refined);
    const showLabels = document.getElementById('vizLabels').checked;
    group.traverse(o => { if (o.isCSS2DObject) o.visible = showLabels; });

    document.getElementById('vizTitle').textContent = 'Price Timelines';
    const phaseTxt = d.live ? (d.phase === 'pre' ? 'pre-market' : d.phase === 'rth' ? 'regular hours' : d.phase === 'post' ? 'after-hours' : 'closed') : 'last session';
    document.getElementById('vizSub').innerHTML =
      (d.live ? `<span class="live-dot"></span>LIVE · ${phaseTxt} · ${d.now_et} ET · ` : '')
      + `${d.date} · ${gi.length} indexes · ${gr.length} refined`;
    document.getElementById('vizDate').value = d.date || '';
    overlay.style.display = 'none';
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.autoRotate = document.getElementById('vizRotate').checked;
    const showLabels = document.getElementById('vizLabels').checked;
    if (group) group.traverse(o => { if (o.isCSS2DObject && o.element.className.indexOf('grp') < 0 && o.element.className.indexOf('open') < 0) o.visible = showLabels; });
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }

  let _timer = null, _data = null;
  async function load() {
    const p = new URLSearchParams();
    const ix = document.getElementById('vizIndexes').value.trim();
    const rf = document.getElementById('vizRefined').value.trim();
    const dt = document.getElementById('vizDate').value.trim();
    if (ix) p.set('indexes', ix);
    if (rf) p.set('refined', rf);
    if (dt) p.set('date', dt);
    try {
      const d = await fetch('/api/viz/price_lines?' + p).then(r => r.json());
      if (d.error) throw new Error(d.error);
      _data = d; build(d);
      if (_timer) clearInterval(_timer);
      if (d.live && document.getElementById('vizLive').checked) _timer = setInterval(load, 20000);
    } catch (e) {
      overlay.className = 'err'; overlay.textContent = 'Could not load: ' + e.message; overlay.style.display = 'flex';
    }
  }
  // Metric / grid toggles rebuild from cached data — no refetch.
  document.getElementById('vizMetric').addEventListener('change', () => { if (_data) build(_data); });
  document.getElementById('vizGrid').addEventListener('change', () => { if (_data) build(_data); });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
    if (group) group.traverse(o => { if (o.material && o.material.resolution) o.material.resolution.set(innerWidth, innerHeight); });
  });
  document.getElementById('vizReload').addEventListener('click', () => { overlay.textContent = 'Fetching SIP prices…'; overlay.style.display = 'flex'; load(); });
  document.getElementById('vizLive').addEventListener('change', load);
  document.getElementById('vizDate').addEventListener('change', () => { document.getElementById('vizLive').checked = false; });

  animate();
  load();
</script>
