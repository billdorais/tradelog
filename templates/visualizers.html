<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizers · Kairos</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#06070c; color:#cdd6e6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #glow { position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 24%, rgba(80,120,200,0.12), rgba(6,7,12,0) 60%); }
  #stage { position:fixed; inset:0; z-index:1; }
  canvas { display:block; }

  .topbar { position:fixed; top:0; left:0; right:0; z-index:6; display:flex; align-items:center; gap:14px; padding:12px 18px; }
  .brand { font-weight:700; letter-spacing:0.02em; color:#e6eaf5; }
  .brand small { color:#6f7a99; }
  .nav-link { color:#8a90a2; text-decoration:none; font-size:0.82rem; padding:5px 10px;
    border:1px solid #232840; border-radius:6px; background:rgba(18,21,29,0.6); }
  .nav-link:hover { color:#cdd6e6; border-color:#3a4a6a; }

  .title { position:fixed; z-index:6; top:14px; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; }
  .title h1 { margin:0; font-size:1.05rem; font-weight:800; letter-spacing:0.04em; color:#e6eaf5; }
  .title .sub { font-size:0.74rem; color:#7c8399; margin-top:2px; }
  .live-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#38e08a;
    box-shadow:0 0 8px #38e08a; margin-right:5px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .legend { position:fixed; z-index:6; top:14px; right:18px; font-size:0.72rem; color:#8a90a2;
    display:flex; gap:14px; align-items:center; }
  .legend i { display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }

  .panel { position:fixed; z-index:6; bottom:16px; left:16px; background:rgba(12,14,20,0.82);
    border:1px solid #222840; border-radius:10px; padding:12px 14px; backdrop-filter:blur(6px); }
  .panel .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .panel label { font-size:0.7rem; color:#7c8399; }
  .panel input[type=text], .panel input[type=date] { background:#0c0f16; border:1px solid #2a3050;
    color:#e0e0e0; border-radius:6px; padding:6px 9px; font-size:0.8rem; font-family:inherit; }
  .panel input#vizTicker { width:90px; text-transform:uppercase; }
  .btn { background:#182038; border:1px solid #2f3a63; color:#cfe0ff; border-radius:6px; padding:6px 13px; font-size:0.8rem; cursor:pointer; }
  .btn:hover { background:#202a4a; }
  .toggle { font-size:0.76rem; color:#9aa2b8; display:inline-flex; align-items:center; gap:5px; cursor:pointer; }

  .vlabel { font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; white-space:nowrap;
    pointer-events:none; padding:1px 6px; border-radius:5px; background:rgba(10,12,20,0.6);
    border:1px solid rgba(160,190,255,0.22); text-shadow:0 0 6px rgba(0,0,0,0.9); }
  .vlabel.now { color:#fff; border-color:rgba(120,230,180,0.5); }
  .vlabel.open { color:#c9d4ff; }

  #overlay { position:fixed; inset:0; z-index:8; display:flex; align-items:center; justify-content:center;
    background:#06070c; color:#8a90a2; font-size:0.9rem; text-align:center; padding:24px; }
  #overlay.err { color:#e08a8a; }
</style>

<div id="glow"></div>
<div id="stage"></div>

<div class="topbar">
  <span class="brand">◆ Kairos <small>Visualizers</small></span>
  <a class="nav-link" href="/">← Dashboard</a>
</div>

<div class="title">
  <h1 id="vizTitle">SPY</h1>
  <div class="sub" id="vizSub">loading…</div>
</div>

<div class="legend">
  <span><i style="background:#22d3ee"></i>pre-market</span>
  <span><i style="background:#f472b6"></i>regular hours</span>
  <span><i style="background:#39415e"></i>future</span>
</div>

<div class="panel">
  <div class="row">
    <div><label>Ticker</label><br><input type="text" id="vizTicker" value="SPY"></div>
    <div><label>Session</label><br><input type="date" id="vizDate"></div>
    <button class="btn" id="vizReload">Render</button>
  </div>
  <div class="row" style="margin-top:10px">
    <label class="toggle"><input type="checkbox" id="vizLive" checked> live</label>
    <label class="toggle"><input type="checkbox" id="vizRotate"> auto-rotate</label>
    <label class="toggle"><input type="checkbox" id="vizGrid" checked> grid</label>
  </div>
</div>

<div id="overlay">Loading Three.js…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
  import { Line2 } from 'three/addons/lines/Line2.js';
  import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
  import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

  const overlay = document.getElementById('overlay');
  const stage = document.getElementById('stage');

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x06070c, 0.0012);
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 4000);
  camera.position.set(0, 26, 205);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  stage.appendChild(renderer.domElement);

  const labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(innerWidth, innerHeight);
  Object.assign(labelRenderer.domElement.style, { position: 'fixed', top: '0', left: '0', pointerEvents: 'none', zIndex: '4' });
  document.body.appendChild(labelRenderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.06;
  controls.autoRotateSpeed = 0.5; controls.target.set(0, 6, 0);
  controls.minDistance = 60; controls.maxDistance = 700;

  const WIDTH = 300, HEIGHT = 70, AXIS = 720;          // X span, Y span, minutes 04:00→16:00
  const COL_PRE = new THREE.Color(0x22d3ee), COL_RTH = new THREE.Color(0xf472b6), COL_FUT = new THREE.Color(0x39415e);
  let group = null, marker = null, pmin = 0, pmax = 1, curveObjs = [];

  const xFor = t => (t / AXIS) * WIDTH - WIDTH / 2;
  const yFor = p => (pmax === pmin ? 0 : ((p - pmin) / (pmax - pmin)) * HEIGHT - HEIGHT / 2);

  function clearScene() {
    if (group) { scene.remove(group); group.traverse(o => { o.geometry?.dispose?.(); o.material?.dispose?.(); }); }
    curveObjs.forEach(o => scene.remove(o)); curveObjs = [];
    group = new THREE.Group(); scene.add(group);
  }

  function mkLabel(cls, html, x, y, z) {
    const el = document.createElement('div'); el.className = 'vlabel ' + cls; el.innerHTML = html;
    const o = new CSS2DObject(el); o.position.set(x, y, z); group.add(o); return o;
  }

  function fatLine(verts, colors, width) {
    const g = new LineGeometry(); g.setPositions(verts); g.setColors(colors);
    const m = new LineMaterial({ linewidth: width, vertexColors: true, transparent: true, dashed: false });
    m.resolution.set(innerWidth, innerHeight);
    const l = new Line2(g, m); l.computeLineDistances(); group.add(l); curveObjs.push(l); return l;
  }

  function buildGrid() {
    if (!document.getElementById('vizGrid').checked) return;
    const grid = new THREE.GridHelper(WIDTH, 24, 0x1b2236, 0x121826);
    grid.position.y = -HEIGHT / 2 - 1; grid.material.transparent = true; grid.material.opacity = 0.5;
    group.add(grid);
    // 09:30 open divider
    const xo = xFor(330);
    const dv = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xo, -HEIGHT/2, 0), new THREE.Vector3(xo, HEIGHT/2, 0)]),
      new THREE.LineBasicMaterial({ color: 0x33507a, transparent: true, opacity: 0.5 }));
    group.add(dv);
    mkLabel('open', '9:30 open', xo, HEIGHT / 2 + 4, 0);
  }

  function build(d) {
    clearScene();
    const pts = d.points || [];
    if (!pts.length) { overlay.className = ''; overlay.textContent = 'No price data for this session yet.'; overlay.style.display = 'flex'; return; }
    pmin = d.price_min; pmax = d.price_max;
    if (pmax === pmin) { pmax = pmin + 1; }
    const pad = (pmax - pmin) * 0.12; pmin -= pad; pmax += pad;

    buildGrid();

    // Price line — split pre vs rth so each segment carries its own color, joined continuously.
    const verts = [], cols = [];
    for (const pt of pts) {
      verts.push(xFor(pt.t), yFor(pt.p), 0);
      const c = pt.s === 'rth' ? COL_RTH : COL_PRE;
      cols.push(c.r, c.g, c.b);
    }
    // Flat future: horizontal leader from the last point to 16:00, fading to grey.
    const last = pts[pts.length - 1];
    if (last.t < AXIS - 1) {
      verts.push(xFor(AXIS), yFor(last.p), 0);
      cols.push(COL_FUT.r, COL_FUT.g, COL_FUT.b);
    }
    fatLine(verts, cols, 3.4);

    // Leading-edge "now" marker + price label.
    const mx = xFor(last.t), my = yFor(last.p);
    marker = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 16),
      new THREE.MeshBasicMaterial({ color: d.phase === 'rth' ? 0xf472b6 : 0x22d3ee }));
    marker.position.set(mx, my, 0); group.add(marker);
    mkLabel('now', `${d.ticker} <b>$${last.p.toFixed(2)}</b>`, mx, my + 5, 0);

    // Title / status
    document.getElementById('vizTitle').textContent = d.ticker;
    const phaseTxt = d.live
      ? (d.phase === 'pre' ? 'pre-market' : d.phase === 'rth' ? 'regular hours' : d.phase === 'post' ? 'after-hours' : 'closed')
      : 'last session';
    document.getElementById('vizSub').innerHTML =
      (d.live ? `<span class="live-dot"></span>LIVE · ${phaseTxt} · ${d.now_et} ET · ` : '')
      + `${d.date} · last $${(d.last_price ?? 0).toFixed(2)}`;
    document.getElementById('vizDate').value = d.date || '';
    overlay.style.display = 'none';
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.autoRotate = document.getElementById('vizRotate').checked;
    if (marker) marker.scale.setScalar(1 + 0.25 * Math.sin(performance.now() * 0.004));
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }

  let _timer = null;
  async function load() {
    overlay.className = ''; if (!group || !curveObjs.length) { overlay.textContent = 'Fetching SIP prices…'; overlay.style.display = 'flex'; }
    const p = new URLSearchParams();
    const tk = document.getElementById('vizTicker').value.trim().toUpperCase();
    const dt = document.getElementById('vizDate').value.trim();
    if (tk) p.set('ticker', tk);
    if (dt) p.set('date', dt);
    try {
      const d = await fetch('/api/viz/price_timeline?' + p).then(r => r.json());
      if (d.error) throw new Error(d.error);
      build(d);
      scheduleLive(d.live);
    } catch (e) {
      overlay.className = 'err'; overlay.textContent = 'Could not load: ' + e.message; overlay.style.display = 'flex';
    }
  }
  function scheduleLive(isLive) {
    if (_timer) clearInterval(_timer);
    if (isLive && document.getElementById('vizLive').checked) _timer = setInterval(load, 20000);
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
    curveObjs.forEach(l => l.material.resolution.set(innerWidth, innerHeight));
  });
  document.getElementById('vizReload').addEventListener('click', () => { overlay.textContent = 'Fetching SIP prices…'; overlay.style.display='flex'; load(); });
  document.getElementById('vizLive').addEventListener('change', () => scheduleLive(true));
  document.getElementById('vizDate').addEventListener('change', () => { document.getElementById('vizLive').checked = false; });

  animate();
  load();
</script>
