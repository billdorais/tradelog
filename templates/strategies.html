<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategies — Kairos Automata</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 0 0 60px;
    }

    header {
      background: #13161f;
      border-bottom: 1px solid #1e2130;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 32px;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; color: #e0e0e0; }

    a.nav-link {
      color: #888;
      text-decoration: none;
      font-size: 0.9rem;
      border: 1px solid #2a2d3e;
      padding: 5px 12px;
      border-radius: 4px;
    }
    a.nav-link:hover { color: #e0e0e0; border-color: #555; }

    .content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── Saved-strategy mini card grid ───────────────────── */
    .mini-section-title {
      font-size: 0.85rem; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 8px 0 14px;
    }
    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 32px;
    }
    @media (max-width: 720px) { .mini-grid { grid-template-columns: 1fr; } }
    .mini-card {
      background: #0d0d0d;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .mini-card .mc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .mini-card .mc-name { font-size: 0.98rem; font-weight: 700; color: #fff; line-height: 1.25; }
    .mini-card .mc-slug { font-size: 0.7rem; color: #555; font-family: monospace; margin-top: 2px; }
    .mini-card .mc-desc { font-size: 0.82rem; color: #a0a0a0; line-height: 1.5; }
    .mini-card .mc-desc.empty { color: #555; font-style: italic; }
    .mini-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .mini-badge {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; padding: 2px 8px; border-radius: 3px;
    }
    .mini-badge.long  { background: rgba(38,166,91,0.18);  color: #5fe0a0; }
    .mini-badge.short { background: rgba(239,83,80,0.18);  color: #ef5350; }
    .mini-params {
      font-size: 0.76rem;
      display: grid; grid-template-columns: auto 1fr; gap: 3px 10px;
      font-family: monospace;
    }
    .mini-params .k { color: #888; }
    .mini-params .v { color: #c8c8c8; font-variant-numeric: tabular-nums; }
    .mini-params.empty { color: #555; font-style: italic; font-family: inherit; font-size: 0.78rem; }
    .mc-del {
      background: transparent; border: 1px solid #2a2d3e; color: #777;
      padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer;
      font-family: inherit;
    }
    .mc-del:hover { border-color: #ef5350; color: #ef5350; }

    /* Strategy card */
    .strategy-card {
      background: #0d0d0d;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 28px 32px;
      margin-bottom: 32px;
    }

    .strategy-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .strategy-subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 24px;
    }

    h2 {
      font-size: 0.75rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 24px 0 10px;
      border-bottom: 1px solid #1e2130;
      padding-bottom: 6px;
    }

    h2:first-of-type { margin-top: 0; }

    p {
      line-height: 1.7;
      color: #b0b0b0;
      margin-bottom: 12px;
    }

    /* Signal condition blocks */
    .signal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 12px 0;
    }

    @media (max-width: 600px) {
      .signal-grid { grid-template-columns: 1fr; }
    }

    .signal-block {
      border-radius: 6px;
      padding: 16px 18px;
    }

    .signal-block.long {
      background: rgba(38,166,91,0.07);
      border: 1px solid rgba(38,166,91,0.25);
    }

    .signal-block.short {
      background: rgba(239,83,80,0.07);
      border: 1px solid rgba(239,83,80,0.25);
    }

    .signal-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .signal-block.long  .signal-label { color: #26a65b; }
    .signal-block.short .signal-label { color: #ef5350; }

    .condition-list {
      list-style: none;
      font-family: monospace;
      font-size: 0.82rem;
      line-height: 1.9;
      color: #c0c0c0;
    }

    .condition-list li::before {
      content: "✓ ";
      color: #555;
    }

    .condition-comment {
      color: #555;
      font-style: italic;
    }

    /* Exit / params table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.88rem;
    }

    th {
      text-align: left;
      color: #666;
      font-weight: 500;
      padding: 8px 12px;
      border-bottom: 1px solid #1e2130;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #111;
      color: #b0b0b0;
      vertical-align: top;
    }

    td:first-child {
      color: #e0e0e0;
      font-weight: 600;
      white-space: nowrap;
      width: 40%;
    }

    /* ── Upload card ───────────────────────────────────────── */
    .upload-card {
      background: #0d0d0d;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 28px 32px;
      margin-bottom: 32px;
    }
    .upload-card h2 { margin-top: 0; }
    .field-label { font-size: 0.72rem; color: #666; text-transform: uppercase;
                   letter-spacing: 0.05em; font-weight: 600; margin-bottom: 6px; display: block; }
    .upload-card input[type=text] {
      width: 100%; background: #0a0a0a; border: 1px solid #2a2d3e; border-radius: 6px;
      color: #e0e0e0; padding: 9px 12px; font-size: 0.88rem; font-family: inherit;
      margin-bottom: 14px;
    }
    .upload-card input[type=text]:focus { outline: none; border-color: #2962ff; }
    .pine-textarea {
      width: 100%; min-height: 200px; background: #060606; border: 1px solid #2a2d3e;
      border-radius: 6px; color: #c8c8c8; padding: 12px 14px; font-size: 0.82rem;
      font-family: 'Courier New', monospace; resize: vertical; margin-bottom: 14px;
    }
    .pine-textarea:focus { outline: none; border-color: #2962ff; }
    .btn-convert { background: #2962ff; color: #fff; border: none; border-radius: 7px;
                   padding: 10px 28px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
                   font-family: inherit; }
    .btn-convert:hover { background: #1a4fd8; }
    .btn-convert:disabled { background: #1e2130; color: #444; cursor: not-allowed; }
    .convert-status { font-size: 0.83rem; color: #555; margin-left: 12px; }
    .code-preview { display: none; margin-top: 16px; background: #060606; border: 1px solid #1e2130;
                    border-radius: 6px; padding: 14px; font-size: 0.78rem; font-family: monospace;
                    color: #aaa; max-height: 260px; overflow-y: auto; white-space: pre; }
    .save-row { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
    .btn-save { background: #26a65b; color: #fff; border: none; border-radius: 7px;
                padding: 9px 24px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
                font-family: inherit; display: none; }
    .btn-save:hover { background: #1e8449; }
    .save-msg { font-size: 0.83rem; }
    .save-ok  { color: #26a65b; }
    .save-err { color: #ef5350; }
  </style>
</head>
<body>

  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <img src="/static/kariosLogo_128.png" alt="Kairos Automata" style="height:36px;width:36px;image-rendering:pixelated">
      <h1>Kairos Automata — Strategies</h1>
    </div>
    <div style="position:relative;display:inline-block">
      <button id="navMenuBtn" onclick="toggleNavMenu()" style="background:transparent;border:1px solid #2a2d3e;color:#aaa;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:1.1rem;line-height:1">&#9776;</button>
      <div id="navMenu" style="display:none;position:absolute;top:calc(100% + 6px);right:0;background:#1a1d2e;border:1px solid #2a2d3e;border-radius:6px;min-width:180px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.4)">
        <a href="/" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#127968; Dashboard</a>
        <a href="/routing" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128257; Signal Router</a>
        <a href="/analysis" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128300; Analysis</a>
        <a href="/strategies" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128200; Strategies</a>        <a href="/optimize" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#128269; Optimizer</a>
        <a href="/variants" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem;border-bottom:1px solid #2a2d3e">&#127757; Variants</a>
        <a href="/about" style="display:block;padding:10px 16px;color:#ccc;text-decoration:none;font-size:0.9rem">&#8505; About</a>
      </div>
    </div>
  </header>

  <div class="content">

    <!-- ── Pine Script Upload ──────────────────────────────── -->
    <div class="upload-card">
      <h2>Upload Pine Script Strategy</h2>
      <label class="field-label" for="stratName">Strategy Name</label>
      <input type="text" id="stratName" placeholder="e.g. My TSLA 5m Strategy">
      <label class="field-label" for="pineInput">Pine Script</label>
      <textarea class="pine-textarea" id="pineInput" placeholder="Paste your Pine Script strategy here…"></textarea>
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px">
        <button class="btn-convert" id="convertBtn" onclick="convertScript()">Convert &amp; Preview</button>
        <span class="convert-status" id="convertStatus"></span>
      </div>
      <div class="save-row" style="margin-top:14px">
        <button class="btn-save" id="saveBtn" onclick="saveStrategy()">&#10003; Save to Optimizer</button>
        <span class="save-msg" id="saveMsg"></span>
      </div>
      <div class="code-preview" id="codePreview"></div>
    </div>

    <!-- ── Saved-strategy mini cards (auto-generated) ──────────────── -->
    <div id="savedStratsWrap" style="display:none">
      <div class="mini-section-title">Your saved strategies</div>
      <div class="mini-grid" id="savedStratsGrid"></div>
    </div>

  </div>

<script>
  function toggleNavMenu() {
    const m = document.getElementById('navMenu');
    m.style.display = m.style.display === 'none' ? 'block' : 'none';
  }
  document.addEventListener('click', e => {
    const btn = document.getElementById('navMenuBtn');
    const menu = document.getElementById('navMenu');
    if (menu && !menu.contains(e.target) && e.target !== btn) menu.style.display = 'none';
  });

  document.addEventListener('DOMContentLoaded', () => { loadSavedStrategies(); });

  let _convertedCode = '';

  async function convertScript() {
    const pine = document.getElementById('pineInput').value.trim();
    if (!pine) { alert('Paste your Pine Script first.'); return; }

    const btn = document.getElementById('convertBtn');
    const status = document.getElementById('convertStatus');
    const preview = document.getElementById('codePreview');
    const saveBtn = document.getElementById('saveBtn');
    const saveMsg = document.getElementById('saveMsg');

    btn.disabled = true;
    btn.textContent = 'Converting…';
    status.textContent = 'Sending to AI…';
    preview.style.display = 'none';
    preview.textContent = '';
    saveBtn.style.display = 'none';
    saveMsg.textContent = '';
    _convertedCode = '';

    try {
      const res = await fetch('/api/bt/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pine_script: pine }),
      });
      if (!res.ok) {
        const err = await res.json();
        status.textContent = 'Error: ' + (err.error || res.status);
        btn.disabled = false; btn.textContent = 'Convert & Preview';
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      preview.style.display = 'block';
      status.textContent = 'Converting…';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const msg = JSON.parse(line.slice(6));
          if (msg.type === 'chunk') {
            _convertedCode += msg.text;
            preview.textContent = _convertedCode;
            preview.scrollTop = preview.scrollHeight;
          } else if (msg.type === 'done') {
            status.textContent = 'Done — review the code below then save.';
            saveBtn.style.display = 'inline-block';
          } else if (msg.type === 'error') {
            status.textContent = 'Error: ' + msg.msg;
          }
        }
      }
    } catch (e) {
      status.textContent = 'Error: ' + e;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Convert & Preview';
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function fmtParamVal(v) {
    if (v === null || v === undefined) return '—';
    if (typeof v === 'number') return Number.isInteger(v) ? String(v) : v.toFixed(2);
    return esc(String(v));
  }

  async function loadSavedStrategies() {
    const wrap = document.getElementById('savedStratsWrap');
    const grid = document.getElementById('savedStratsGrid');
    let cards;
    try {
      const r = await fetch('/api/bt/strategies/cards');
      cards = await r.json();
      if (!Array.isArray(cards)) throw new Error(cards.error || 'bad response');
    } catch (e) {
      wrap.style.display = 'none';
      return;
    }
    if (!cards.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    grid.innerHTML = cards.map(c => {
      const badges = [
        c.long  ? '<span class="mini-badge long">Long</span>'  : '',
        c.short ? '<span class="mini-badge short">Short</span>' : '',
      ].join('');
      const desc = c.description
        ? `<div class="mc-desc">${esc(c.description)}</div>`
        : `<div class="mc-desc empty">No description available — add comments to your Pine Script or a class docstring.</div>`;
      const params = (c.params || []).slice(0, 6);
      const paramsHtml = params.length
        ? `<div class="mini-params">${params.map(p =>
             `<span class="k">${esc(p.label || p.id)}</span><span class="v">${fmtParamVal(p.default)}</span>`
           ).join('')}</div>`
        : `<div class="mini-params empty">No tunable parameters detected.</div>`;
      return `
        <div class="mini-card" data-slug="${esc(c.slug)}">
          <div class="mc-head">
            <div>
              <div class="mc-name">${esc(c.name)}</div>
              <div class="mc-slug">${esc(c.slug)}</div>
            </div>
            <button class="mc-del" onclick="deleteStrategy('${esc(c.slug)}', '${esc(c.name)}')">Delete</button>
          </div>
          <div class="mini-badges">${badges}</div>
          ${desc}
          ${paramsHtml}
        </div>`;
    }).join('');
  }

  async function deleteStrategy(slug, name) {
    if (!confirm(`Delete "${name}" (${slug})? This cannot be undone.`)) return;
    try {
      const r = await fetch(`/api/bt/strategies/${encodeURIComponent(slug)}`, { method: 'DELETE' });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        alert('Delete failed: ' + (err.error || r.status));
        return;
      }
      loadSavedStrategies();
    } catch (e) {
      alert('Delete error: ' + e);
    }
  }

  async function saveStrategy() {
    const name = document.getElementById('stratName').value.trim();
    if (!name) { alert('Enter a strategy name first.'); return; }
    if (!_convertedCode) { alert('Convert the script first.'); return; }

    const saveBtn = document.getElementById('saveBtn');
    const saveMsg = document.getElementById('saveMsg');
    saveBtn.disabled = true;

    try {
      const res = await fetch('/api/bt/strategies/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, code: _convertedCode, pine_code: document.getElementById('pineInput').value.trim() }),
      });
      const data = await res.json();
      if (res.ok) {
        saveMsg.className = 'save-msg save-ok';
        saveMsg.textContent = `Saved "${data.name}" — go to Optimizer to run it.`;
        document.getElementById('pineInput').value = '';
        document.getElementById('stratName').value = '';
        document.getElementById('codePreview').style.display = 'none';
        _convertedCode = '';
        saveBtn.style.display = 'none';
        loadSavedStrategies();
      } else {
        saveMsg.className = 'save-msg save-err';
        saveMsg.textContent = 'Save failed: ' + (data.error || res.status);
      }
    } catch (e) {
      saveMsg.className = 'save-msg save-err';
      saveMsg.textContent = 'Error: ' + e;
    } finally {
      saveBtn.disabled = false;
    }
  }
</script>
</body>
</html>
